# The inbound-mail worker.
#
# This is the address suppliers send invoices to, so it is the one public
# surface that accepts data from strangers. It archives before it records, and
# it authenticates the webhook - Postmark by HTTP Basic credentials in the URL,
# Mailgun by signature.

app = "belegbox-worker"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[build.args]
  APP = "worker"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  MUSTANG_SVC_URL = "http://belegbox-mustang.internal:8081"
  INGEST_PROVIDER = "postmark"
  RETENTION_YEARS = "10"
  S3_OBJECT_LOCK_MODE = "COMPLIANCE"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Kept warm. A provider that times out on a cold start retries, and a retry
  # storm against an endpoint that archives is not what anyone wants to debug.
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# flyctl secrets set --app belegbox-worker \
#   DATABASE_URL=... S3_BUCKET_RAW=... S3_REGION=eu-central-1 \
#   S3_ACCESS_KEY_ID=... S3_SECRET_ACCESS_KEY=... \
#   POSTMARK_WEBHOOK_USER=... POSTMARK_WEBHOOK_PASSWORD=... INBOX_DOMAIN=...
#
# POSTMARK_WEBHOOK_PASSWORD is the only thing standing between the internet and
# an endpoint that writes to the archive. It must come from a generator, not
# from someone's head.
