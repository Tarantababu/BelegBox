name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      # Snapshots are committed. A KoSIT configuration bump or a rule change
      # then shows up here as an explicit diff of which verdicts moved (R-2).
      - run: pnpm test

      # Sprint 0 exit criterion. Runs offline: detection, profile legality and
      # D-001 without the JVM. The form verdict reports "unknown", never a guess.
      # Object Lock is the archive's whole immutability claim, and a bucket that
      # merely says it is locked is not evidence. Ek A calls for proof.
      - name: Prove undeletability against a locked bucket
        run: |
          curl -sL -o /tmp/minio https://dl.min.io/server/minio/release/linux-amd64/minio
          curl -sL -o /tmp/mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /tmp/minio /tmp/mc
          MINIO_ROOT_USER=belegbox MINIO_ROOT_PASSWORD=belegbox-dev-secret \
            /tmp/minio server /tmp/miniodata --address 127.0.0.1:9000 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          /tmp/mc alias set local http://127.0.0.1:9000 belegbox belegbox-dev-secret
          # Locking can only be enabled at bucket creation.
          /tmp/mc mb --with-lock local/belegbox-raw-dev
          S3_TEST_ENDPOINT=http://127.0.0.1:9000 pnpm --filter @belegbox/storage exec vitest run
          S3_TEST_ENDPOINT=http://127.0.0.1:9000 pnpm --filter @belegbox/worker exec vitest run

      - name: Validate the corpus
        run: pnpm validate --offline corpus/*.xml

      # The case the product exists for: syntactically perfect, materially
      # wrong. Exit code 1 is the pass condition here.
      - name: The content layer catches what the syntax layer cannot
        run: |
          if pnpm validate --offline --ruleset rulesets/gastro-de.yaml \
               --explain tr corpus/gastro-beverage-7pct-01.xml; then
            echo "expected a content failure on the beverage fixture" >&2
            exit 1
          fi

      # The form verdict, from the tool the public portals run. Without this the
      # dual verdict is half unproven.
      - name: Set up Java for the validator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start mustang-svc and validate against the real KoSIT engine
        run: |
          cd services/mustang-svc
          ./scripts/fetch-validator-config.sh
          mvn -q -B package
          java -jar target/mustang-svc.jar &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8081/health >/dev/null && break
            sleep 1
          done
          cd ../..
          MUSTANG_SVC_URL=http://localhost:8081 pnpm --filter @belegbox/validation exec vitest run

      # Every explanation must carry the disclaimer. Rendering is what proves
      # it, since the disclaimer is appended by the renderer and cannot be
      # switched off by a template.
      - name: Explanations carry their disclaimer
        run: |
          pnpm validate --offline --ruleset rulesets/gastro-de.yaml \
            --explain de corpus/gastro-beverage-7pct-01.xml > out.txt || true
          grep -q "keine steuerliche Beratung" out.txt

  db:
    name: PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: belegbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Row Level Security, FORCE, triggers and grants cannot be exercised
      # against a substitute. Without this job the isolation guarantee is a
      # claim rather than a test.
      - name: Migrate and run the isolation suite
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/belegbox
        run: pnpm --filter @belegbox/db exec vitest run

  jvm:
    name: mustang-svc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mustang-svc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Verifies the release digest. A configuration replaced in place fails
      # here rather than silently changing what "valid" means.
      - name: Fetch the pinned KoSIT validator configuration
        run: ./scripts/fetch-validator-config.sh

      - run: mvn -B package

      - name: Boot and probe
        run: |
          java -jar target/mustang-svc.jar &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8081/health && break
            sleep 1
          done
          curl -fsS http://localhost:8081/health | tee /dev/stderr | grep -q 'v20'

      - name: Reject an oversized body
        run: |
          head -c 34000000 /dev/zero > /tmp/big.xml
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            --data-binary @/tmp/big.xml http://localhost:8081/validate)
          test "$code" = "413"
